name: Weekly data refresh

# Closes the last manual step in the loop.
#
# Cloud Run captures raw data daily and writes it to Cloud Storage, but it
# cannot publish: getting fresh numbers onto the site means committing a
# regenerated payload, and a Cloud Run job has no way to push to git. This
# workflow does the compute and publish halves — load raw into canonical,
# rebuild the payloads, commit only if something actually changed, and let the
# push trigger Netlify.
#
# Runs daily rather than only on Tuesday. The load is cheap, it keeps the
# coverage catalog current, and the commit step is a no-op when nothing moved,
# so a daily cadence costs nothing and means a missed Tuesday self-heals.

on:
  schedule:
    # 14:00 UTC = 07:00 America/Los_Angeles, an hour after the 06:00 PT capture.
    # GitHub schedules are UTC and do not shift with daylight saving, so this
    # lands at 06:00 PT in winter. Both are after the capture either way.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to summarise"
        required: false
        default: "2026"

permissions:
  contents: write

# Never let two refreshes race each other into the same branch.
concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: apes-mac-salad
      OUTPUT_BUCKET: apes-mac-salad-raw-prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install --quiet "google-cloud-bigquery>=3,<4" "google-cloud-storage>=2.14,<4"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Load raw captures into canonical
        working-directory: sleeper_work
        run: python load_weekly_canonical.py

      - name: Refresh control plane and coverage catalog
        working-directory: sleeper_work
        run: python load_control_plane.py

      - name: Load reference data into canonical
        working-directory: sleeper_work
        run: python load_reference_canonical.py

      # Power rankings are stored per week, so this must run before the payload
      # is rebuilt: the movement column compares against the snapshot the
      # previous run wrote.
      - name: Rebuild power rankings
        working-directory: sleeper_work
        run: python build_power_rankings.py

      - name: Rebuild the weekly recap payload
        working-directory: sleeper_work
        run: python build_weekly_recap.py --season "${{ github.event.inputs.season || '2026' }}"

      # A payload that does not compile is worse than a stale one, so the build
      # gates the commit rather than running after it.
      - name: Verify the site still builds
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test:sites

      - name: Commit refreshed payloads if they changed
        id: commit
        run: |
          git config user.name "ams-pipeline[bot]"
          git config user.email "ams-pipeline@users.noreply.github.com"
          git add src/generated/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No payload change; nothing to publish."
          else
            git commit -m "data: refresh weekly recap payload

          Generated by the scheduled refresh from the canonical layer.
          Raw source of record: gs://$OUTPUT_BUCKET"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Summary
        run: |
          {
            echo "### Weekly refresh"
            echo ""
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "Payload changed and was published; Netlify will redeploy."
            else
              echo "No change in generated payloads."
            fi
            echo ""
            echo "Raw store of record: \`gs://$OUTPUT_BUCKET\`"
          } >> "$GITHUB_STEP_SUMMARY"
